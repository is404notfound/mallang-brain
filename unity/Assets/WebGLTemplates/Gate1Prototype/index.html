<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>말랑두뇌음악대학 · Gate 1</title>
  <style>
    * { box-sizing:border-box; } html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#0a1221; color:#fff; font:14px system-ui,sans-serif; }
    #unity-canvas { width:100%; height:100%; display:block; touch-action:none; }
    #status { position:fixed; bottom:max(8px, env(safe-area-inset-bottom)); left:max(8px, env(safe-area-inset-left)); margin:0; padding:7px 10px; background:#101922e8; border-radius:8px; z-index:2; }
    #loading { position:fixed; inset:0; display:grid; place-content:center; text-align:center; background:#0a1221; padding:24px; }
    #loading[hidden] { display:none; }
    #loading p { color:#c4d6df; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" width="1280" height="720" tabindex="0" aria-label="말랑두뇌음악대학 Gate 1 마림바 콘테스트"></canvas>
  <p id="status" role="status">Gate 1 프로토타입 · 가로 화면을 준비하고 있어요.</p>
  <div id="loading"><h1>말랑두뇌음악대학</h1><p id="progress">마림바 콘테스트를 불러오는 중이에요.</p></div>
  <script>
    const status = document.getElementById('status');
    const progress = document.getElementById('progress');
    window.gate1Prototype = { unityReady:false, orientation:'not-checked' };
    let statusTimer;
    window.gate1OrientationStatus = message => {
      status.hidden = false;
      status.textContent = message;
      clearTimeout(statusTimer);
      if (message.includes('완료')) statusTimer = setTimeout(() => { status.hidden = true; }, 2200);
    };
    const loader = document.createElement('script');
    loader.src = 'Build/{{{ LOADER_FILENAME }}}';
    loader.onerror = () => { progress.textContent = '실행 파일을 불러오지 못했어요. 연결을 확인한 뒤 새로고침해 주세요.'; };
    loader.onload = () => {
      createUnityInstance(document.getElementById('unity-canvas'), {
        dataUrl:'Build/{{{ DATA_FILENAME }}}', frameworkUrl:'Build/{{{ FRAMEWORK_FILENAME }}}', codeUrl:'Build/{{{ CODE_FILENAME }}}',
        streamingAssetsUrl:'StreamingAssets', companyName:'is404notfound', productName:'Mallang Brain Gate 1', productVersion:'0.1.0',
        showBanner:(message,type) => { if(type === 'error') { progress.textContent=message; document.getElementById('loading').hidden=false; } console[type === 'error' ? 'error' : 'warn'](message); }
      }, p => { progress.textContent = '불러오는 중 ' + Math.round(p * 100) + '%'; })
      .then(instance => { window.gate1Unity=instance; window.gate1Prototype.unityReady=true; document.getElementById('loading').hidden=true; document.getElementById('unity-canvas').focus(); })
      .catch(error => { progress.textContent='Unity 실행 실패: '+error.message; });
    };
    document.body.appendChild(loader);
  </script>
</body>
</html>
